name: publish-release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify signed tag
        run: |
          gpg --import .github/release-signers.asc
          git verify-tag "$GITHUB_REF_NAME"

      - name: Compute release version
        id: version
        run: |
          VERSION="$GITHUB_REF_NAME"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "error: release version '$VERSION' must not end with -SNAPSHOT" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: gradle

      - name: Publish release
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
        run: |
          ./gradlew :SwiftKitCore:publish :SwiftKitFFM:publish \
                    -PreleaseBuild=true -PswiftkitVersion=${{ steps.version.outputs.version }}

      - name: Close staging repository on Central Portal
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
        run: |
          BEARER=$(printf "%s:%s" "$SONATYPE_USER" "$SONATYPE_TOKEN" | base64)
          curl -i --retry 5 -H "Authorization: Bearer $BEARER" -X POST \
            https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/org.swift.swiftjava
          echo "Finish the release at https://central.sonatype.com/publishing/deployments"
