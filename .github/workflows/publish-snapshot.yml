name: publish-snapshot

on:
  push:
    branches: [main]
    tags-ignore:
      - '**'
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: gradle

      - name: Compute snapshot version
        id: version
        run: |
          VERSION="$(scripts/next-snapshot-version.sh)"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "error: computed version '$VERSION' does not end with -SNAPSHOT" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
        run: |
          ./gradlew :SwiftKitCore:publishAllPublicationsToSonatypeRepository \
                    :SwiftKitFFM:publishAllPublicationsToSonatypeRepository \
                    -PswiftkitVersion=${{ steps.version.outputs.version }}
