name: snapshot-publish

# Publishes SNAPSHOT artifacts of the swift-java Java + native libraries to the
# Sonatype Central Portal snapshots repository at:
#   https://central.sonatype.com/repository/maven-snapshots/
#
# Two artifact families per snapshot:
#   * Java-only (classifier-less): swiftkit-core, swiftkit-ffm
#       Published once from a single canonical job (`publish-java`).
#   * Native classifier jars: swiftkit-core-native, swiftkit-ffm-native
#       Published from a per-platform matrix; each matrix job uploads only its
#       own classifier jar.
#
# The version is derived from git tags by build.gradle.kts; on `main` it always
# resolves to a -SNAPSHOT version.
#
# Required repository secrets:
#   JRELEASER_NEXUS2_USERNAME            -- Sonatype credentials for snapshot path
#   JRELEASER_NEXUS2_PASSWORD            -- (Portal user-token usually works here too)
#   JRELEASER_GPG_PUBLIC_KEY             -- ASCII-armored PGP public key
#   JRELEASER_GPG_SECRET_KEY             -- ASCII-armored PGP private key
#   JRELEASER_GPG_PASSPHRASE             -- Passphrase for the PGP key
#   JRELEASER_GITHUB_TOKEN               -- GitHub token for JReleaser (we don't
#                                           cut releases — any valid token works)

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: snapshot-publish
  cancel-in-progress: false

env:
  # Single source of truth for the Swift toolchain version used across all jobs.
  # Bump this to upgrade Swift; ALSO update the matrix `swift:X.Y-*` container
  # references below (GitHub Actions doesn't expand env into matrix `include`
  # containers).
  SWIFT_TOOLCHAIN_VERSION: "6.3"
  JRELEASER_NEXUS2_USERNAME: ${{ secrets.JRELEASER_NEXUS2_USERNAME }}
  JRELEASER_NEXUS2_PASSWORD: ${{ secrets.JRELEASER_NEXUS2_PASSWORD }}
  JRELEASER_GPG_PUBLIC_KEY:  ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
  JRELEASER_GPG_SECRET_KEY:  ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
  JRELEASER_GPG_PASSPHRASE:  ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
  JRELEASER_GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ==== --------------------------------------------------------------------
  # Java-only artifacts (swiftkit-core, swiftkit-ffm)
  # ==== --------------------------------------------------------------------
  publish-java:
    name: Publish Java jars (snapshot)
    runs-on: ubuntu-latest
    container:
      image: swift:6.3-noble
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # required so computeVersion() sees tag history

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: |
            25
            17
          cache: gradle

      - name: Set JAVA_HOME_25
        shell: bash
        run: |
          if [[ -n "$JAVA_HOME_25_X64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_X64" >> $GITHUB_ENV
          elif [[ -n "$JAVA_HOME_25_ARM64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_ARM64" >> $GITHUB_ENV
          fi

      - name: Verify version is a SNAPSHOT
        shell: bash
        run: |
          VERSION="$(./gradlew -q printVersion)"
          echo "Computed version: $VERSION"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Snapshot workflow requires -SNAPSHOT version, got: $VERSION"
            exit 1
          fi

      - name: Verify required secrets are present
        shell: bash
        run: |
          missing=()
          [[ -z "$JRELEASER_NEXUS2_USERNAME" ]] && missing+=("JRELEASER_NEXUS2_USERNAME")
          [[ -z "$JRELEASER_NEXUS2_PASSWORD" ]] && missing+=("JRELEASER_NEXUS2_PASSWORD")
          [[ -z "$JRELEASER_GPG_PUBLIC_KEY" ]] && missing+=("JRELEASER_GPG_PUBLIC_KEY")
          [[ -z "$JRELEASER_GPG_SECRET_KEY" ]] && missing+=("JRELEASER_GPG_SECRET_KEY")
          [[ -z "$JRELEASER_GPG_PASSPHRASE" ]] && missing+=("JRELEASER_GPG_PASSPHRASE")
          if [[ ${#missing[@]} -ne 0 ]]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Stage Java jars to local directory
        run: |
          ./gradlew \
            :SwiftKitCore:publish \
            :SwiftKitFFM:publish \
            --no-daemon --stacktrace

      - name: Deploy with JReleaser
        run: ./gradlew jreleaserDeploy --no-daemon --stacktrace

      - name: Upload JReleaser logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs-publish-java
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties

  # ==== --------------------------------------------------------------------
  # Native Linux classifier jars (one per matrix entry)
  #
  # The published Maven classifier is composed at runtime as
  # `<platform>-swift_${SWIFT_TOOLCHAIN_VERSION}-<arch>` so the Swift toolchain
  # version is baked into the artifact name (Swift's Linux runtime ABI is not
  # stable across toolchain versions).
  # ==== --------------------------------------------------------------------
  publish-natives-linux:
    name: Publish natives (${{ matrix.platform }}-${{ matrix.arch }}) snapshot
    needs: publish-java
    runs-on: ${{ matrix.runs_on }}
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu22.04
            arch: x86_64
            runs_on: ubuntu-latest
            container: swift:6.3-jammy
          - platform: ubuntu22.04
            arch: aarch_64
            runs_on: ubuntu-24.04-arm
            container: swift:6.3-jammy
          - platform: ubuntu24.04
            arch: x86_64
            runs_on: ubuntu-latest
            container: swift:6.3-noble
          - platform: ubuntu24.04
            arch: aarch_64
            runs_on: ubuntu-24.04-arm
            container: swift:6.3-noble
          - platform: amazonlinux2
            arch: x86_64
            runs_on: ubuntu-latest
            container: swift:6.3-amazonlinux2
          - platform: amazonlinux2
            arch: aarch_64
            runs_on: ubuntu-24.04-arm
            container: swift:6.3-amazonlinux2
          # Static-linux SDK builds for "best-effort" portable Linux variants:
          # the Swift runtime is statically linked, so the resulting dylibs
          # work across any glibc-compatible distro.
          - platform: linux
            arch: x86_64
            runs_on: ubuntu-latest
            container: swift:6.3-jammy
            swift_sdk: x86_64-swift-linux-musl
          - platform: linux
            arch: aarch_64
            runs_on: ubuntu-24.04-arm
            container: swift:6.3-jammy
            swift_sdk: aarch64-swift-linux-musl
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: |
            25
            17
          cache: gradle

      - name: Set JAVA_HOME_25
        shell: bash
        run: |
          if [[ -n "$JAVA_HOME_25_X64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_X64" >> $GITHUB_ENV
          elif [[ -n "$JAVA_HOME_25_ARM64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_ARM64" >> $GITHUB_ENV
          fi

      - name: Compute Maven classifier
        shell: bash
        run: |
          CLASSIFIER="${{ matrix.platform }}-swift_${SWIFT_TOOLCHAIN_VERSION}-${{ matrix.arch }}"
          echo "CLASSIFIER=$CLASSIFIER" >> "$GITHUB_ENV"
          echo "Computed classifier: $CLASSIFIER"

      - name: Install Swift static-linux SDK
        if: matrix.swift_sdk
        shell: bash
        run: |
          # SDK URL is derived from SWIFT_TOOLCHAIN_VERSION at the top of this file.
          VERSION="${SWIFT_TOOLCHAIN_VERSION}"
          SWIFT_STATIC_SDK_URL="https://download.swift.org/swift-${VERSION}-RELEASE/static-sdk/swift-${VERSION}-RELEASE_static-linux-0.0.1/swift-${VERSION}-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz"
          swift sdk install "$SWIFT_STATIC_SDK_URL"

      - name: Stage ${{ env.CLASSIFIER }} native jars
        shell: bash
        run: |
          GRADLE_ARGS=(
            -PnativeClassifier="${CLASSIFIER}"
            -PswiftVersion="${SWIFT_TOOLCHAIN_VERSION}"
          )
          if [[ -n "${{ matrix.swift_sdk }}" ]]; then
            GRADLE_ARGS+=(-PnativeBuildSdk=${{ matrix.swift_sdk }})
          fi
          ./gradlew "${GRADLE_ARGS[@]}" \
            :SwiftKitCoreNative:publish \
            :SwiftKitFFMNative:publish \
            --no-daemon --stacktrace

      - name: Deploy with JReleaser
        run: ./gradlew jreleaserDeploy --no-daemon --stacktrace

      - name: Upload JReleaser logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs-natives-${{ env.CLASSIFIER }}
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties

  # ==== --------------------------------------------------------------------
  # Native macOS arm64 classifier jar
  # ==== --------------------------------------------------------------------
  publish-natives-macos:
    name: Publish natives (osx-aarch_64) snapshot
    needs: publish-java
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Swift via Swiftly
        run: ./.github/scripts/install_swiftly.sh
        env:
          SWIFT_VERSION: ${{ env.SWIFT_TOOLCHAIN_VERSION }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: |
            25
            17
          cache: gradle

      - name: Set JAVA_HOME_25
        shell: bash
        run: |
          if [[ -n "$JAVA_HOME_25_X64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_X64" >> $GITHUB_ENV
          elif [[ -n "$JAVA_HOME_25_ARM64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_ARM64" >> $GITHUB_ENV
          fi

      - name: Stage osx-aarch_64 native jars
        shell: bash
        run: |
          ./gradlew \
            -PnativeClassifier=osx-aarch_64 \
            -PswiftVersion="${SWIFT_TOOLCHAIN_VERSION}" \
            :SwiftKitCoreNative:publish \
            :SwiftKitFFMNative:publish \
            --no-daemon --stacktrace

      - name: Deploy with JReleaser
        run: ./gradlew jreleaserDeploy --no-daemon --stacktrace

      - name: Upload JReleaser logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs-natives-osx-aarch_64
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties

  # ==== --------------------------------------------------------------------
  # Smoke test: resolve the just-published -SNAPSHOT artifacts from a
  # throwaway Gradle project. Catches POM/metadata mistakes that pass
  # JReleaser validation but break real consumers.
  # ==== --------------------------------------------------------------------
  smoke-test-snapshot:
    name: Smoke test snapshot consumption
    needs: [publish-java, publish-natives-linux, publish-natives-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        run: echo "v=$(./gradlew -q printVersion)" >> "$GITHUB_OUTPUT"

      - name: Wait for snapshot metadata to become visible
        shell: bash
        run: |
          # Snapshot uploads can take up to ~1 minute to appear via the public
          # snapshot repo URL. Poll for maven-metadata.xml before trying to
          # resolve.
          URL="https://central.sonatype.com/repository/maven-snapshots/org/swift/swiftjava/swiftkit-core/${{ steps.version.outputs.v }}/maven-metadata.xml"
          for i in {1..30}; do
            if curl -sfL -o /dev/null "$URL"; then
              echo "Snapshot metadata visible at $URL"
              exit 0
            fi
            echo "[$i/30] not yet visible, retrying in 10s..."
            sleep 10
          done
          echo "::error::Snapshot metadata did not become visible at $URL"
          exit 1

      - name: Create throwaway consumer project and resolve
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.v }}"
          NATIVE_CLASSIFIER="linux-swift_${SWIFT_TOOLCHAIN_VERSION}-x86_64"
          mkdir -p /tmp/smoke && cd /tmp/smoke
          cat > settings.gradle.kts <<EOF
          rootProject.name = "swiftjava-smoke"
          EOF
          cat > build.gradle.kts <<EOF
          plugins {
              java
          }
          repositories {
              maven("https://central.sonatype.com/repository/maven-snapshots/") {
                  mavenContent { snapshotsOnly() }
              }
              mavenCentral()
          }
          dependencies {
              implementation("org.swift.swiftjava:swiftkit-core:$VERSION")
              // The static-SDK Linux classifier is the closest match for a
              // generic GitHub Actions Linux runner.
              runtimeOnly("org.swift.swiftjava:swiftkit-core-native:$VERSION:$NATIVE_CLASSIFIER")
              implementation("org.swift.swiftjava:swiftkit-ffm:$VERSION")
              runtimeOnly("org.swift.swiftjava:swiftkit-ffm-native:$VERSION:$NATIVE_CLASSIFIER")
          }
          EOF
          gradle dependencies --configuration runtimeClasspath --refresh-dependencies
