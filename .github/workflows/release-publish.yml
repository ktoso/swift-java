name: release-publish

# Publishes signed RELEASE artifacts of the swift-java Java + native libraries
# to Maven Central via the Sonatype Central Portal.
#
# Triggered by pushing a Git tag matching N.N.N (e.g. 0.1.0). The version is
# derived from the tag by build.gradle.kts.
#
# Two artifact families per release:
#   * Java-only (classifier-less): swiftkit-core, swiftkit-ffm
#       Published once from a single canonical job (`publish-java`).
#   * Native classifier jars: swiftkit-core-native, swiftkit-ffm-native
#       Published from a per-platform matrix; each matrix job uploads only its
#       own classifier jar under the same coordinates.
#
# vanniktech's publishToMavenCentral uploads a deployment to the Central Portal
# but does NOT release it (automaticRelease = false in the convention plugin).
# A human must finalize the deployment at:
#   https://central.sonatype.com/publishing/deployments
#
# Required repository secrets:
#   SONATYPE_USER                        -- Sonatype Central Portal user token name
#   SONATYPE_TOKEN                       -- Sonatype Central Portal user token value
#   ORG_GRADLE_PROJECT_SIGNINGKEY        -- Armored PGP private key
#   ORG_GRADLE_PROJECT_SIGNINGPASSWORD   -- Passphrase for the PGP key

permissions:
  contents: read

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag) to publish from"
        required: true

concurrency:
  group: release-publish
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USER }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_TOKEN }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}

jobs:
  # ==== --------------------------------------------------------------------
  # Java-only artifacts (swiftkit-core, swiftkit-ffm)
  # ==== --------------------------------------------------------------------
  publish-java:
    name: Publish Java jars (release)
    runs-on: ubuntu-latest
    container:
      image: swift:6.3-jammy
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: |
            25
            17
          cache: gradle

      - name: Set JAVA_HOME_25
        shell: bash
        run: |
          if [[ -n "$JAVA_HOME_25_X64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_X64" >> $GITHUB_ENV
          elif [[ -n "$JAVA_HOME_25_ARM64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_ARM64" >> $GITHUB_ENV
          fi

      - name: Verify version is a release (no -SNAPSHOT)
        shell: bash
        run: |
          VERSION="$(./gradlew -q printVersion)"
          echo "Computed version: $VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Release workflow requires non-SNAPSHOT version, got: $VERSION"
            echo "::error::HEAD must be exactly at a release tag (N.N.N) for the release workflow."
            exit 1
          fi
          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$REF" != "$VERSION" ]]; then
            echo "::error::Tag '$REF' does not match computed version '$VERSION'."
            exit 1
          fi

      - name: Verify required secrets are present
        shell: bash
        run: |
          missing=()
          [[ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ]] && missing+=("SONATYPE_USER")
          [[ -z "$ORG_GRADLE_PROJECT_mavenCentralPassword" ]] && missing+=("SONATYPE_TOKEN")
          [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]] && missing+=("ORG_GRADLE_PROJECT_SIGNINGKEY")
          [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" ]] && missing+=("ORG_GRADLE_PROJECT_SIGNINGPASSWORD")
          if [[ ${#missing[@]} -ne 0 ]]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Publish Java jars to Sonatype Central Portal
        run: |
          ./gradlew \
            :SwiftKitCore:publishToMavenCentral \
            :SwiftKitFFM:publishToMavenCentral \
            --no-daemon --no-parallel --stacktrace

  # ==== --------------------------------------------------------------------
  # Native Linux classifier jars (one per matrix entry)
  # ==== --------------------------------------------------------------------
  publish-natives-linux:
    name: Publish natives (${{ matrix.classifier }}) release
    needs: publish-java
    runs-on: ${{ matrix.runs_on }}
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: ubuntu22.04-x86_64
            runs_on: ubuntu-latest
            container: swift:6.3-jammy
          - classifier: ubuntu22.04-aarch_64
            runs_on: ubuntu-24.04-arm
            container: swift:6.3-jammy
          - classifier: ubuntu24.04-x86_64
            runs_on: ubuntu-latest
            container: swift:6.3-noble
          - classifier: ubuntu24.04-aarch_64
            runs_on: ubuntu-24.04-arm
            container: swift:6.3-noble
          - classifier: amazonlinux2-x86_64
            runs_on: ubuntu-latest
            container: swift:6.3-amazonlinux2
          - classifier: amazonlinux2-aarch_64
            runs_on: ubuntu-24.04-arm
            container: swift:6.3-amazonlinux2
          - classifier: linux-x86_64
            runs_on: ubuntu-latest
            container: swift:6.3-jammy
            swift_sdk: x86_64-swift-linux-musl
          - classifier: linux-aarch_64
            runs_on: ubuntu-24.04-arm
            container: swift:6.3-jammy
            swift_sdk: aarch64-swift-linux-musl
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: |
            25
            17
          cache: gradle

      - name: Set JAVA_HOME_25
        shell: bash
        run: |
          if [[ -n "$JAVA_HOME_25_X64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_X64" >> $GITHUB_ENV
          elif [[ -n "$JAVA_HOME_25_ARM64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_ARM64" >> $GITHUB_ENV
          fi

      - name: Install Swift static-linux SDK
        if: matrix.swift_sdk
        shell: bash
        run: |
          # TODO: bump SWIFT_STATIC_SDK_URL when upgrading the Swift toolchain.
          SWIFT_STATIC_SDK_URL="https://download.swift.org/swift-6.3-RELEASE/static-sdk/swift-6.3-RELEASE_static-linux-0.0.1/swift-6.3-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz"
          swift sdk install "$SWIFT_STATIC_SDK_URL"

      - name: Publish ${{ matrix.classifier }} native jar
        shell: bash
        run: |
          GRADLE_ARGS=(-PnativeClassifier=${{ matrix.classifier }})
          if [[ -n "${{ matrix.swift_sdk }}" ]]; then
            GRADLE_ARGS+=(-PnativeBuildSdk=${{ matrix.swift_sdk }})
          fi
          ./gradlew "${GRADLE_ARGS[@]}" \
            :SwiftKitCoreNative:publishToMavenCentral \
            :SwiftKitFFMNative:publishToMavenCentral \
            --no-daemon --no-parallel --stacktrace

  # ==== --------------------------------------------------------------------
  # Native macOS arm64 classifier jar
  # ==== --------------------------------------------------------------------
  publish-natives-macos:
    name: Publish natives (osx-aarch_64) release
    needs: publish-java
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install Swift via Swiftly
        run: ./.github/scripts/install_swiftly.sh
        env:
          SWIFT_VERSION: "6.3"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: |
            25
            17
          cache: gradle

      - name: Set JAVA_HOME_25
        shell: bash
        run: |
          if [[ -n "$JAVA_HOME_25_X64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_X64" >> $GITHUB_ENV
          elif [[ -n "$JAVA_HOME_25_ARM64" ]]; then
            echo "JAVA_HOME_25=$JAVA_HOME_25_ARM64" >> $GITHUB_ENV
          fi

      - name: Publish osx-aarch_64 native jar
        shell: bash
        run: |
          ./gradlew -PnativeClassifier=osx-aarch_64 \
            :SwiftKitCoreNative:publishToMavenCentral \
            :SwiftKitFFMNative:publishToMavenCentral \
            --no-daemon --no-parallel --stacktrace

  # ==== --------------------------------------------------------------------
  # Final hint: humans need to finalize the deployment in the Central Portal UI
  # ==== --------------------------------------------------------------------
  finalize-hint:
    name: Finalization reminder
    needs: [publish-natives-linux, publish-natives-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print finalization URL
        shell: bash
        run: |
          echo "All publish jobs are done."
          echo "Review and finalize the deployment at:"
          echo "  https://central.sonatype.com/publishing/deployments"
